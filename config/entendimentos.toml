Alcance subjetivo da coisa julgada em ação coletiva quando a sentença não
delimita expressamente os beneficiários.
"""
tese = """
PREENCHER — transcrever do acórdão. O que se apurou na pesquisa é que, quando
a sentença coletiva não delimita expressamente seus beneficiários, a coisa
julgada alcança toda a categoria, e não apenas os filiados. NÃO CITAR sem
conferir o inteiro teor.
"""
trilha          = "executar"
efeito          = "coisa_julgada_alcanca_a_categoria"
criterios = [
  "a sentença coletiva não delimita expressamente os beneficiários",
]
fonte = "PREENCHER — acórdão do STF"
observacoes = """
NÃO MONITORÁVEL pela nossa coleta: o STF está fora do DataJud. Qualquer
acompanhamento deste tema é leitura humana, e o motor não deve sugerir o
contrário.

Relacionado e a conferir: RE 573.232, sobre legitimidade do associado para
executar sentença de ação coletiva de ASSOCIAÇÃO — regime diferente do de
sindicato, e confundir os dois é erro que extingue execução.
"""
homologado      = "N"


