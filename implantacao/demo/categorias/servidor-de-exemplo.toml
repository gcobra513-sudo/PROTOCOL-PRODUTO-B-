# CATÁLOGO FICTÍCIO — SÓ PARA A DEMONSTRAÇÃO.
#
# Nada aqui existe: nem a carreira, nem a ação, nem o processo. Ele serve
# para a demonstração mostrar o que o portal diz quando uma ação JÁ foi
# conferida e assinada por advogado — coisa que, no catálogo de verdade
# (`config/categorias/`), ainda não aconteceu com nenhuma.
#
# `ficticio = true` é o que impede este arquivo de chegar a um sindicato de
# verdade: `nucleo/entendimentos.py` só o lê pela demonstração, e a
# demonstração só sobe em modo ensaio. Não copie este arquivo para
# `config/categorias/`: o carregamento recusa a pasta inteira.
#
# `homologado = "S"` aqui NÃO é a assinatura de ninguém. Não há nome de
# advogado nem número de OAB neste arquivo, de propósito.

[catalogo]
versao       = 1
ficticio     = true
levantado_em = "2026-11-25"
categoria    = "Servidor de Exemplo (carreira fictícia)"
cargos = [
  "servidor de exemplo",
  "servidora de exemplo",
]

[[acoes_coletivas]]
id              = "EXEMPLO-FICTICIA"
descricao       = "Gratificação de Exemplo (ação FICTÍCIA)"
numero_cnj      = ""
situacao        = "transitado_em_julgado"
categoria       = "Servidor de Exemplo (carreira fictícia)"
periodo_inicio  = "2003-01"
periodo_fim     = "2008-12"
exige_rol       = true
ajuizada_em     = "2005-01"
fonte           = "FICTÍCIA — ação inventada para a demonstração; não existe em tribunal nenhum"
observacoes = """
Inventada. O período e a exigência de rol foram escolhidos para a
demonstração ter os três resultados: quem pode, quem ainda depende de
alguma coisa, e quem não pode por estar fora do rol.
"""
homologado      = "S"

# A VERBA, também inventada: 10% sobre o vencimento básico. O percentual e o
# "sobre o quê" são redondos de propósito, para a conta da demonstração ser
# conferível de cabeça.
[[verbas]]
id            = "GRATIFICACAO-DE-EXEMPLO"
acao          = "EXEMPLO-FICTICIA"
descricao     = "Gratificação de Exemplo (verba FICTÍCIA)"
percentual    = "0.10"
incide_sobre  = "o vencimento básico de cada mês"
fonte         = "FICTÍCIA — dispositivo inventado para a demonstração"
homologado    = "S"

# OS TEMAS, também inventados — de um tribunal que não existe. Servem para a
# demonstração mostrar o acompanhamento das teses: um tema que "acabou de
# ser julgado" e um que "vai ser julgado". As datas abaixo são trocadas pela
# demonstração na hora em que ela sobe (ontem, e doze dias atrás), para a
# novidade ser sempre recente. NENHUM está homologado: a novidade aparece
# como "ainda não conferida por advogado", que é o estado de verdade de um
# julgamento que acabou de sair.
[[entendimentos]]
id              = "EXEMPLO-TEMA-JULGADO"
tribunal        = "Tribunal de Exemplo (FICTÍCIO)"
tema            = "9001"
situacao        = "julgado"
julgado_em      = "2026-11-20"
suspensao_nacional = false
questao = "Questão inventada: os servidores de exemplo têm direito à diferença da gratificação de exemplo?"
tese = "Tese inventada para a demonstração: os servidores de exemplo têm direito à diferença da gratificação de exemplo."
trilha          = "ajuizar"
criterios       = ["ser servidor de exemplo no período da gratificação de exemplo"]
fonte           = "FICTÍCIA — tema inventado para a demonstração; não existe em tribunal nenhum"
homologado      = "N"

[[entendimentos]]
id              = "EXEMPLO-TEMA-AFETADO"
tribunal        = "Tribunal de Exemplo (FICTÍCIO)"
tema            = "9002"
situacao        = "afetado"
afetado_em      = "2026-11-14"
suspensao_nacional = false
questao = "Questão inventada: o adicional de exemplo entra na base de cálculo da gratificação de exemplo?"
tese = ""
trilha          = "ajuizar"
criterios       = []
fonte           = "FICTÍCIA — tema inventado para a demonstração; não existe em tribunal nenhum"
homologado      = "N"
